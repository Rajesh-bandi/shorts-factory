# Production AWS stack: docker compose -f docker-compose.aws.yml up -d --build
# All persistent data lives under /opt/shorts on the root EBS volume.
# Docker and every service use restart: unless-stopped, so a stop/start of the
# EC2 instance brings the whole stack back automatically. See deploy/AWS.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shorts}
      POSTGRES_USER: ${POSTGRES_USER:-shorts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - /opt/shorts/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: &small-logs
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: multi
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      DATA_DIR: /data
      SERVE_FRONTEND: "false"
      FORWARDED_ALLOW_IPS: "*"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-}
      HF_HOME: /data/.cache
      YTDLP_COOKIES_FILE: /secrets/youtube-cookies.txt
      YTDLP_PROXY: ${YTDLP_PROXY:-}
    volumes:
      - /opt/shorts/data:/data
      - /opt/shorts/secrets:/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    logging: *small-logs

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    logging: *small-logs

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      OMNIROUTE_BASIC_AUTH_HASH: ${OMNIROUTE_BASIC_AUTH_HASH:?set OMNIROUTE_BASIC_AUTH_HASH in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/shorts/caddy/data:/data
      - /opt/shorts/caddy/config:/config
    depends_on:
      - frontend
    logging: *small-logs

  # Private AI gateway. Bound to host loopback only; reach the dashboard from
  # your PC with: ssh -L 20128:127.0.0.1:20128 ubuntu@<elastic-ip>
  omniroute:
    image: diegosouzapw/omniroute:latest
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      OMNIROUTE_MEMORY_MB: "3072"
    # Leave most of the 8 GB host for Postgres, ffmpeg and Whisper.
    mem_limit: 3g
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - omniroute_data:/app/data
    logging: *small-logs

volumes:
  omniroute_data:
